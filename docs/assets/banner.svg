<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="Parallax: o juiz de comportamento das mudanças feitas por agentes de código">
  <!-- Banner do README. Mesma marca de docs/assets/icon.svg (base azul e candidata violeta deslocadas, a
       interseção na cor do Solaris), em escala grande. Texto em fontes do sistema: o GitHub mostra o SVG como
       imagem e não carrega fontes externas. -->
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141526"/>
      <stop offset="1" stop-color="#070a10"/>
    </linearGradient>
    <radialGradient id="aura" cx="80%" cy="50%" r="45%">
      <stop offset="0" stop-color="#c4b1f2" stop-opacity=".18"/>
      <stop offset="1" stop-color="#c4b1f2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="base" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#b9d6f7"/>
      <stop offset="1" stop-color="#4f7fbf"/>
    </radialGradient>
    <radialGradient id="cand" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#ddd0fa"/>
      <stop offset="1" stop-color="#7d63c4"/>
    </radialGradient>
    <linearGradient id="lente" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd98c"/>
      <stop offset="1" stop-color="#e08a35"/>
    </linearGradient>
    <clipPath id="soBase"><circle cx="960" cy="160" r="90"/></clipPath>
  </defs>
  <rect width="1280" height="320" rx="24" fill="url(#fundo)"/>
  <rect width="1280" height="320" rx="24" fill="url(#aura)"/>
  <g fill="#e6eaf0">
    <circle cx="72" cy="40" r="1.2" opacity=".5"/><circle cx="210" cy="270" r="1" opacity=".4"/>
    <circle cx="380" cy="34" r="1.4" opacity=".6"/><circle cx="560" cy="290" r="1" opacity=".35"/>
    <circle cx="640" cy="60" r="1.1" opacity=".45"/><circle cx="760" cy="280" r="1.3" opacity=".5"/>
    <circle cx="1210" cy="48" r="1.2" opacity=".55"/><circle cx="1240" cy="260" r="1" opacity=".4"/>
    <circle cx="880" cy="30" r="1" opacity=".4"/><circle cx="470" cy="150" r=".9" opacity=".3"/>
  </g>
  <!-- linhas de visada: os dois pontos de vista que dão a paralaxe -->
  <g stroke="#e6eaf0" stroke-opacity=".18" stroke-width="1.2" stroke-dasharray="4 6">
    <line x1="960" y1="160" x2="760" y2="40"/><line x1="960" y1="160" x2="760" y2="280"/>
    <line x1="1050" y1="160" x2="1250" y2="40"/><line x1="1050" y1="160" x2="1250" y2="280"/>
  </g>
  <circle cx="960" cy="160" r="90" fill="url(#base)" fill-opacity=".9"/>
  <circle cx="1050" cy="160" r="90" fill="url(#cand)" fill-opacity=".9"/>
  <circle cx="1050" cy="160" r="90" fill="url(#lente)" clip-path="url(#soBase)"/>
  <circle cx="960" cy="160" r="90" fill="none" stroke="#e6eaf0" stroke-opacity=".35" stroke-width="1.5"/>
  <circle cx="1050" cy="160" r="90" fill="none" stroke="#e6eaf0" stroke-opacity=".35" stroke-width="1.5"/>
  <circle cx="1118" cy="52" r="9" fill="#f28b8b"/>
  <g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="15" fill="#aab3c2">
    <text x="900" y="300" text-anchor="middle">base</text>
    <text x="1110" y="300" text-anchor="middle">candidata</text>
  </g>
  <g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif">
    <text x="80" y="150" font-size="88" font-weight="700" fill="#e6eaf0" letter-spacing="-1">Parallax</text>
    <text x="84" y="200" font-size="26" fill="#aab3c2">O juiz de comportamento das mudanças feitas por agentes</text>
    <text x="84" y="246" font-size="18" fill="#c4b1f2" letter-spacing="1.5">GRAVA · REPETE · COMPARA · VEREDITO</text>
  </g>
</svg>
